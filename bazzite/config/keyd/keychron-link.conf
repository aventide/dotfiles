[ids]

# Keychron Link keyboard interface observed on the original machine.
# Check with sudo keyd monitor and replace this ID for your keyboard.
# The k: prefix keeps this scoped to keyboard devices only.
k:3434:d030:8f88fcbf

[main]
# Physical Command keys become Control.
leftmeta = layer(control)
rightmeta = layer(control)

# Caps Lock becomes the Linux Super/Meta key.
capslock = layer(meta)
